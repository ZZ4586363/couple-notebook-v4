<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情侣记事本 V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
        }
        
        .gradient-bg-blue {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #c2e9fb 100%);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-card-dark {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .task-card {
            transition: all 0.3s ease;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .task-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .priority-low { border-left: 4px solid #10b981; }
        .priority-medium { border-left: 4px solid #f59e0b; }
        .priority-high { border-left: 4px solid #ef4444; }
        .priority-urgent { border-left: 4px solid #8b5cf6; }
        
        .btn-primary {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(96, 165, 250, 0.4);
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
            transition: width 0.5s ease;
        }
        
        .floating-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .bounce-animation {
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .heart-beat {
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        
        .tab-active {
            color: #ec4899;
            border-bottom: 3px solid #ec4899;
        }
        
        .chat-message {
            max-width: 70%;
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 8px;
        }
        
        .chat-message-sent {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .chat-message-received {
            background: #f3f4f6;
            color: #1f2937;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        
        .music-player {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        
        .photo-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .photo-item:hover {
            transform: scale(1.05);
        }
        
        .modal {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .penalty-card {
            background: linear-gradient(135deg, #f43f5e 0%, #ef4444 100%);
            color: white;
            border-radius: 16px;
            padding: 20px;
            margin: 10px 0;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        @media (max-width: 640px) {
            .chat-message {
                max-width: 85%;
            }
            
            .glass-card {
                margin: 10px;
                border-radius: 16px;
            }
        }
        
        .dark-mode {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
        }
        
        .dark-mode .glass-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .dark-mode .chat-message-received {
            background: #334155;
            color: white;
        }
        
        .dark-mode .task-card {
            background: rgba(30, 41, 59, 0.9);
            color: white;
        }
    </style>
</head>
<body class="gradient-bg">
    <!-- 背景装饰 -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-20 left-10 w-20 h-20 bg-pink-200 rounded-full opacity-20 floating-animation"></div>
        <div class="absolute top-40 right-20 w-16 h-16 bg-blue-200 rounded-full opacity-20 floating-animation" style="animation-delay: 1s;"></div>
        <div class="absolute bottom-40 left-20 w-24 h-24 bg-purple-200 rounded-full opacity-20 floating-animation" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-20 right-10 w-28 h-28 bg-pink-200 rounded-full opacity-20 floating-animation" style="animation-delay: 0.5s;"></div>
    </div>

    <!-- 主容器 -->
    <div class="relative z-10">
        <!-- 顶部导航 -->
        <header class="glass-card sticky top-0 z-50 border-b border-gray-200/20">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-3">
                        <div class="heart-beat">
                            <i data-lucide="heart" class="w-8 h-8 text-pink-500"></i>
                        </div>
                        <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">
                            情侣记事本 V4
                        </h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button id="musicToggle" class="p-2 rounded-full hover:bg-gray-200/50 transition-colors">
                            <i data-lucide="music" class="w-6 h-6 text-gray-600"></i>
                        </button>
                        <button id="darkModeToggle" class="p-2 rounded-full hover:bg-gray-200/50 transition-colors">
                            <i data-lucide="moon" class="w-6 h-6 text-gray-600"></i>
                        </button>
                        <button id="settingsBtn" class="p-2 rounded-full hover:bg-gray-200/50 transition-colors">
                            <i data-lucide="settings" class="w-6 h-6 text-gray-600"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 标签页导航 -->
            <div class="glass-card rounded-xl p-2 mb-8">
                <div class="flex space-x-2">
                    <button class="tab-btn tab-active flex-1 py-3 px-4 rounded-lg text-center font-medium transition-all" data-tab="tasks">
                        <i data-lucide="clipboard-list" class="w-5 h-5 inline mr-2"></i>任务清单
                    </button>
                    <button class="tab-btn flex-1 py-3 px-4 rounded-lg text-center font-medium transition-all" data-tab="stats">
                        <i data-lucide="bar-chart-3" class="w-5 h-5 inline mr-2"></i>积分统计
                    </button>
                    <button class="tab-btn flex-1 py-3 px-4 rounded-lg text-center font-medium transition-all" data-tab="chat">
                        <i data-lucide="message-circle" class="w-5 h-5 inline mr-2"></i>聊天
                    </button>
                    <button class="tab-btn flex-1 py-3 px-4 rounded-lg text-center font-medium transition-all" data-tab="photos">
                        <i data-lucide="images" class="w-5 h-5 inline mr-2"></i>照片
                    </button>
                </div>
            </div>

            <!-- 任务清单页面 -->
            <div id="tasksTab" class="tab-content">
                <!-- 积分进度 -->
                <div class="glass-card rounded-xl p-6 mb-8" data-aos="fade-up">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-800">💝 积分进度</h2>
                        <span id="totalPoints" class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">0/100</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                        <div id="progressBar" class="progress-bar h-full rounded-full" style="width: 0%"></div>
                    </div>
                    <p class="text-sm text-gray-600 mt-2">累计100分即可向马跃峰许愿 🎁</p>
                </div>

                <!-- 添加任务按钮 -->
                <div class="mb-8 text-center">
                    <button id="addTaskBtn" class="btn-primary text-white px-8 py-3 rounded-full font-semibold text-lg shadow-lg">
                        <i data-lucide="plus" class="w-6 h-6 inline mr-2"></i>添加新任务
                    </button>
                </div>

                <!-- 任务列表 -->
                <div id="taskList" class="space-y-4">
                    <!-- 任务卡片将通过JavaScript动态生成 -->
                </div>
            </div>

            <!-- 积分统计页面 -->
            <div id="statsTab" class="tab-content hidden">
                <div class="glass-card rounded-xl p-6 mb-8" data-aos="fade-up">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">📊 积分统计</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <canvas id="pointsChart" width="400" height="300"></canvas>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold mb-4">🏆 排行榜</h3>
                            <div id="leaderboard" class="space-y-3">
                                <!-- 排行榜将通过JavaScript动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 聊天页面 -->
            <div id="chatTab" class="tab-content hidden">
                <div class="glass-card rounded-xl p-4 h-[60vh] flex flex-col" data-aos="fade-up">
                    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
                        <!-- 聊天消息将通过JavaScript动态生成 -->
                    </div>
                    <div class="border-t pt-4">
                        <div class="flex space-x-2">
                            <input type="text" id="chatInput" placeholder="输入消息..." class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500">
                            <button id="sendMessageBtn" class="btn-primary text-white px-6 py-2 rounded-full">
                                <i data-lucide="send" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 照片页面 -->
            <div id="photosTab" class="tab-content hidden">
                <div class="glass-card rounded-xl p-6" data-aos="fade-up">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-800">📸 照片墙</h2>
                        <button id="uploadPhotoBtn" class="btn-secondary text-white px-4 py-2 rounded-lg">
                            <i data-lucide="upload" class="w-5 h-5 inline mr-2"></i>上传照片
                        </button>
                    </div>
                    <div id="photoGallery" class="photo-gallery">
                        <!-- 照片将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 添加任务模态框 -->
    <div id="addTaskModal" class="modal fixed inset-0 flex items-center justify-center z-50 hidden">
        <div class="modal-content w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">添加新任务</h3>
                <button class="close-modal text-gray-500 hover:text-gray-700">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form id="addTaskForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">任务名称</label>
                    <input type="text" id="taskName" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">任务描述</label>
                    <textarea id="taskDescription" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">优先级</label>
                        <select id="taskPriority" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500">
                            <option value="low">低 (1分)</option>
                            <option value="medium">中 (3分)</option>
                            <option value="high">高 (5分)</option>
                            <option value="urgent">紧急 (10分)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">负责人</label>
                        <select id="taskAssignee" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500">
                            <option value="马跃峰">马跃峰</option>
                            <option value="伴侣">伴侣</option>
                            <option value="两人一起">两人一起</option>
                        </select>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">截止时间</label>
                    <input type="datetime-local" id="taskDeadline" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">惩罚措施</label>
                    <input type="text" id="taskPenalty" placeholder="未完成的惩罚..." class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" class="close-modal px-4 py-2 border border-gray-300 rounded-lg">取消</button>
                    <button type="submit" class="btn-primary text-white px-4 py-2 rounded-lg">添加任务</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 通知组件 -->
    <div id="notification" class="notification">
        <div class="flex items-center">
            <i id="notificationIcon" class="w-6 h-6 mr-3"></i>
            <span id="notificationText"></span>
        </div>
    </div>

    <!-- 音乐播放器 -->
    <div id="musicPlayer" class="music-player fixed bottom-0 left-0 right-0 p-4 flex items-center justify-between z-40 hidden">
        <div class="flex items-center space-x-3">
            <i data-lucide="music" class="w-6 h-6 text-pink-500"></i>
            <div>
                <p class="font-medium text-sm">浪漫音乐</p>
                <p class="text-xs text-gray-500">正在播放</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button id="musicPlayPause" class="p-2 rounded-full hover:bg-gray-200">
                <i data-lucide="pause" class="w-5 h-5"></i>
            </button>
            <button id="musicClose" class="p-2 rounded-full hover:bg-gray-200">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <script>
        // 全局变量
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let points = JSON.parse(localStorage.getItem('points')) || { '马跃峰': 0, '伴侣': 0 };
        let messages = JSON.parse(localStorage.getItem('messages')) || [];
        let photos = JSON.parse(localStorage.getItem('photos')) || [];
        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        let isMusicPlaying = false;
        let audio = new Audio();

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            AOS.init({
                duration: 800,
                once: true
            });
            
            lucide.createIcons();
            setupEventListeners();
            renderTasks();
            renderStats();
            renderChat();
            renderPhotos();
            updateProgress();
            applyDarkMode();
            
            // 显示欢迎通知
            showNotification('欢迎使用情侣记事本 V4！', 'heart', 'text-pink-500');
        }

        function setupEventListeners() {
            // 标签页切换
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tab = this.dataset.tab;
                    switchTab(tab);
                });
            });

            // 添加任务
            document.getElementById('addTaskBtn').addEventListener('click', function() {
                openModal('addTaskModal');
            });

            document.getElementById('addTaskForm').addEventListener('submit', function(e) {
                e.preventDefault();
                addTask();
            });

            // 关闭模态框
            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', function() {
                    closeAllModals();
                });
            });

            // 音乐控制
            document.getElementById('musicToggle').addEventListener('click', toggleMusic);
            document.getElementById('musicPlayPause').addEventListener('click', toggleMusicPlayPause);
            document.getElementById('musicClose').addEventListener('click', closeMusicPlayer);

            // 深色模式
            document.getElementById('darkModeToggle').addEventListener('click', toggleDarkMode);

            // 聊天
            document.getElementById('sendMessageBtn').addEventListener('click', sendMessage);
            document.getElementById('chatInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // 照片上传
            document.getElementById('uploadPhotoBtn').addEventListener('click', uploadPhoto);

            // 设置
            document.getElementById('settingsBtn').addEventListener('click', showSettings);

            // 点击模态框外部关闭
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeAllModals();
                    }
                });
            });
        }

        function switchTab(tabName) {
            // 更新标签页状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
            });
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('tab-active');

            // 显示对应内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`${tabName}Tab`).classList.remove('hidden');

            // 特殊处理
            if (tabName === 'stats') {
                renderStats();
            }
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center py-12">
                        <div class="floating-animation mb-4">
                            <i data-lucide="heart" class="w-16 h-16 text-pink-300"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-600 mb-2">还没有任务</h3>
                        <p class="text-gray-500">点击"添加新任务"开始你们的甜蜜之旅吧！</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            tasks.forEach((task, index) => {
                const taskCard = createTaskCard(task, index);
                taskList.appendChild(taskCard);
            });

            lucide.createIcons();
        }

        function createTaskCard(task, index) {
            const card = document.createElement('div');
            card.className = `task-card glass-card priority-${task.priority} ${task.completed ? 'opacity-60' : ''}`;
            card.innerHTML = `
                <div class="p-6">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-semibold text-lg ${task.completed ? 'line-through text-gray-500' : 'text-gray-800'}">${task.name}</h3>
                            <p class="text-sm text-gray-600 mt-1">${task.description || '暂无描述'}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-1 text-xs rounded-full ${getPriorityBadgeClass(task.priority)}">
                                ${getPriorityText(task.priority)}
                            </span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between text-sm text-gray-500 mb-4">
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center">
                                <i data-lucide="user" class="w-4 h-4 mr-1"></i>
                                <span>${task.assignee}</span>
                            </div>
                            <div class="flex items-center">
                                <i data-lucide="clock" class="w-4 h-4 mr-1"></i>
                                <span>${formatDate(task.deadline)}</span>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i data-lucide="star" class="w-4 h-4 mr-1 text-yellow-400"></i>
                            <span class="font-semibold">${getPriorityPoints(task.priority)}分</span>
                        </div>
                    </div>
                    
                    ${task.penalty ? `
                        <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
                            <div class="flex items-center text-red-600">
                                <i data-lucide="alert-triangle" class="w-4 h-4 mr-2"></i>
                                <span class="text-sm font-medium">惩罚措施</span>
                            </div>
                            <p class="text-sm text-red-700 mt-1">${task.penalty}</p>
                        </div>
                    ` : ''}
                    
                    <div class="flex justify-between items-center">
                        <div class="flex space-x-2">
                            ${!task.completed ? `
                                <button onclick="completeTask(${index})" class="btn-primary text-white px-4 py-2 rounded-lg text-sm">
                                    <i data-lucide="check" class="w-4 h-4 inline mr-1"></i>完成
                                </button>
                                <button onclick="editTask(${index})" class="px-4 py-2 border border-gray-300 rounded-lg text-sm">
                                    <i data-lucide="edit" class="w-4 h-4 inline mr-1"></i>编辑
                                </button>
                            ` : `
                                <span class="text-green-600 font-medium">
                                    <i data-lucide="check-circle" class="w-4 h-4 inline mr-1"></i>已完成
                                </span>
                            `}
                        </div>
                        <button onclick="deleteTask(${index})" class="text-gray-400 hover:text-red-500">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        function addTask() {
            const formData = new FormData(document.getElementById('addTaskForm'));
            const task = {
                id: Date.now(),
                name: document.getElementById('taskName').value,
                description: document.getElementById('taskDescription').value,
                priority: document.getElementById('taskPriority').value,
                assignee: document.getElementById('taskAssignee').value,
                deadline: document.getElementById('taskDeadline').value,
                penalty: document.getElementById('taskPenalty').value,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.push(task);
            saveData();
            renderTasks();
            closeAllModals();
            document.getElementById('addTaskForm').reset();
            
            showNotification('任务添加成功！', 'check-circle', 'text-green-500');
        }

        function completeTask(index) {
            tasks[index].completed = true;
            const pointsEarned = getPriorityPoints(tasks[index].priority);
            
            if (tasks[index].assignee === '两人一起') {
                points['马跃峰'] += pointsEarned;
                points['伴侣'] += pointsEarned;
            } else {
                points[tasks[index].assignee] += pointsEarned;
            }
            
            saveData();
            renderTasks();
            updateProgress();
            
            showNotification(`任务完成！获得 ${pointsEarned} 积分`, 'trophy', 'text-yellow-500');
            
            // 检查是否达到100分
            const totalPoints = points['马跃峰'] + points['伴侣'];
            if (totalPoints >= 100) {
                setTimeout(() => {
                    showNotification('🎉 恭喜！累计积分达到100分，可以许愿了！', 'gift', 'text-pink-500');
                }, 1000);
            }
        }

        function deleteTask(index) {
            if (confirm('确定要删除这个任务吗？')) {
                tasks.splice(index, 1);
                saveData();
                renderTasks();
                showNotification('任务已删除', 'trash-2', 'text-red-500');
            }
        }

        function getPriorityPoints(priority) {
            const pointsMap = {
                'low': 1,
                'medium': 3,
                'high': 5,
                'urgent': 10
            };
            return pointsMap[priority] || 1;
        }

        function getPriorityText(priority) {
            const textMap = {
                'low': '低优先级',
                'medium': '中优先级',
                'high': '高优先级',
                'urgent': '紧急'
            };
            return textMap[priority] || '低优先级';
        }

        function getPriorityBadgeClass(priority) {
            const classMap = {
                'low': 'bg-green-100 text-green-800',
                'medium': 'bg-yellow-100 text-yellow-800',
                'high': 'bg-red-100 text-red-800',
                'urgent': 'bg-purple-100 text-purple-800'
            };
            return classMap[priority] || 'bg-green-100 text-green-800';
        }

        function updateProgress() {
            const totalPoints = points['马跃峰'] + points['伴侣'];
            const percentage = Math.min((totalPoints / 100) * 100, 100);
            
            document.getElementById('totalPoints').textContent = `${totalPoints}/100`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        function renderStats() {
            renderChart();
            renderLeaderboard();
        }

        function renderChart() {
            const ctx = document.getElementById('pointsChart').getContext('2d');
            
            // 销毁现有图表
            if (window.pointsChart) {
                window.pointsChart.destroy();
            }
            
            window.pointsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['马跃峰', '伴侣'],
                    datasets: [{
                        data: [points['马跃峰'], points['伴侣']],
                        backgroundColor: ['#ec4899', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        title: {
                            display: true,
                            text: '积分分布',
                            font: {
                                size: 16,
                                weight: 'bold'
                            }
                        }
                    }
                }
            });
        }

        function renderLeaderboard() {
            const leaderboard = document.getElementById('leaderboard');
            const sortedPoints = Object.entries(points)
                .sort(([,a], [,b]) => b - a);
            
            leaderboard.innerHTML = sortedPoints.map(([name, point], index) => `
                <div class="flex justify-between items-center p-3 rounded-lg ${index === 0 ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white' : 'bg-gray-100'}">
                    <div class="flex items-center space-x-3">
                        <span class="font-bold">${index + 1}</span>
                        <span>${name}</span>
                    </div>
                    <span class="font-bold">${point} 分</span>
                </div>
            `).join('');
        }

        function renderChat() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = messages.map(msg => `
                <div class="chat-message ${msg.sender === 'me' ? 'chat-message-sent' : 'chat-message-received'}">
                    <p>${msg.text}</p>
                    <span class="text-xs opacity-70">${formatTime(msg.timestamp)}</span>
                </div>
            `).join('');
            
            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (text) {
                const message = {
                    id: Date.now(),
                    text: text,
                    sender: 'me',
                    timestamp: new Date().toISOString()
                };
                
                messages.push(message);
                saveData();
                renderChat();
                input.value = '';
                
                // 模拟回复
                setTimeout(() => {
                    const replies = [
                        '收到啦！❤️',
                        '好的，我知道了~',
                        '爱你哦！😘',
                        '马上就去做！',
                        '你最好了！',
                        '么么哒~',
                        '遵命！',
                        '我也想你！'
                    ];
                    const randomReply = replies[Math.floor(Math.random() * replies.length)];
                    
                    const replyMessage = {
                        id: Date.now(),
                        text: randomReply,
                        sender: 'partner',
                        timestamp: new Date().toISOString()
                    };
                    
                    messages.push(replyMessage);
                    saveData();
                    renderChat();
                }, 1000);
            }
        }

        function renderPhotos() {
            const photoGallery = document.getElementById('photoGallery');
            
            if (photos.length === 0) {
                photoGallery.innerHTML = `
                    <div class="text-center py-12 col-span-full">
                        <i data-lucide="camera" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                        <p class="text-gray-500">还没有照片，上传第一张照片吧！</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            photoGallery.innerHTML = photos.map(photo => `
                <div class="photo-item" onclick="viewPhoto('${photo}')">
                    <img src="${photo}" alt="照片" class="w-full h-full object-cover">
                </div>
            `).join('');
        }

        function uploadPhoto() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        photos.push(e.target.result);
                        saveData();
                        renderPhotos();
                        showNotification('照片上传成功！', 'check-circle', 'text-green-500');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function viewPhoto(photoUrl) {
            // 创建查看照片的模态框
            const modal = document.createElement('div');
            modal.className = 'modal fixed inset-0 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="modal-content bg-black p-4 rounded-lg">
                    <button onclick="this.closest('.modal').remove()" class="absolute top-4 right-4 text-white">
                        <i data-lucide="x" class="w-8 h-8"></i>
                    </button>
                    <img src="${photoUrl}" alt="照片" class="max-w-full max-h-[80vh] object-contain">
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons();
            
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.remove();
                }
            });
        }

        function toggleMusic() {
            if (!isMusicPlaying) {
                // 这里使用示例音乐URL，实际使用时需要替换为真实的音乐文件
                audio.src = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
                audio.play().then(() => {
                    isMusicPlaying = true;
                    document.getElementById('musicPlayer').classList.remove('hidden');
                    showNotification('🎵 音乐已开始播放', 'music', 'text-pink-500');
                }).catch(error => {
                    console.error('音乐播放失败:', error);
                    showNotification('音乐播放失败，请检查网络', 'x-circle', 'text-red-500');
                });
            } else {
                closeMusicPlayer();
            }
        }

        function toggleMusicPlayPause() {
            if (audio.paused) {
                audio.play();
                document.querySelector('#musicPlayPause i').setAttribute('data-lucide', 'pause');
            } else {
                audio.pause();
                document.querySelector('#musicPlayPause i').setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }

        function closeMusicPlayer() {
            audio.pause();
            audio.src = '';
            isMusicPlaying = false;
            document.getElementById('musicPlayer').classList.add('hidden');
            showNotification('音乐已停止播放', 'music', 'text-gray-500');
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('darkMode', isDarkMode);
            applyDarkMode();
        }

        function applyDarkMode() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                document.querySelector('#darkModeToggle i').setAttribute('data-lucide', 'sun');
            } else {
                document.body.classList.remove('dark-mode');
                document.querySelector('#darkModeToggle i').setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function showSettings() {
            const settings = [
                { name: '重置所有数据', action: resetData },
                { name: '导出数据', action: exportData },
                { name: '导入数据', action: importData },
                { name: '关于', action: showAbout }
            ];
            
            const modal = document.createElement('div');
            modal.className = 'modal fixed inset-0 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="modal-content w-full max-w-md p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold">设置</h3>
                        <button onclick="this.closest('.modal').remove()" class="text-gray-500 hover:text-gray-700">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                    </div>
                    <div class="space-y-3">
                        ${settings.map(setting => `
                            <button onclick="${setting.action.name}()" class="w-full text-left p-3 rounded-lg hover:bg-gray-100 transition-colors">
                                ${setting.name}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons();
            
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.remove();
                }
            });
        }

        function resetData() {
            if (confirm('确定要重置所有数据吗？此操作不可恢复！')) {
                tasks = [];
                points = { '马跃峰': 0, '伴侣': 0 };
                messages = [];
                photos = [];
                saveData();
                renderTasks();
                renderStats();
                renderChat();
                renderPhotos();
                updateProgress();
                showNotification('数据已重置', 'check-circle', 'text-green-500');
                closeAllModals();
            }
        }

        function exportData() {
            const data = {
                tasks,
                points,
                messages,
                photos,
                exportDate: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `couple-notebook-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showNotification('数据导出成功', 'download', 'text-green-500');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (data.tasks && data.points) {
                                tasks = data.tasks || [];
                                points = data.points || { '马跃峰': 0, '伴侣': 0 };
                                messages = data.messages || [];
                                photos = data.photos || [];
                                saveData();
                                renderTasks();
                                renderStats();
                                renderChat();
                                renderPhotos();
                                updateProgress();
                                showNotification('数据导入成功', 'check-circle', 'text-green-500');
                            } else {
                                showNotification('无效的数据文件', 'x-circle', 'text-red-500');
                            }
                        } catch (error) {
                            showNotification('数据文件解析失败', 'x-circle', 'text-red-500');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function showAbout() {
            const modal = document.createElement('div');
            modal.className = 'modal fixed inset-0 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="modal-content w-full max-w-md p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold">关于情侣记事本 V4</h3>
                        <button onclick="this.closest('.modal').remove()" class="text-gray-500 hover:text-gray-700">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div class="text-center">
                            <div class="heart-beat inline-block">
                                <i data-lucide="heart" class="w-12 h-12 text-pink-500"></i>
                            </div>
                            <h4 class="text-xl font-bold mt-2">情侣记事本 V4</h4>
                            <p class="text-gray-600">让爱情更甜蜜的小助手</p>
                        </div>
                        <div class="space-y-2">
                            <p><strong>功能特色：</strong></p>
                            <ul class="list-disc list-inside text-gray-600 space-y-1">
                                <li>双人任务管理</li>
                                <li>积分累计系统（100分许愿）</li>
                                <li>实时聊天功能</li>
                                <li>照片墙</li>
                                <li>浪漫音乐</li>
                                <li>惩罚机制</li>
                                <li>数据备份导出</li>
                            </ul>
                        </div>
                        <p class="text-sm text-gray-500 text-center">
                            愿天下有情人终成眷属 ❤️
                        </p>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons();
            
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.remove();
                }
            });
        }

        function showNotification(text, icon, iconClass = 'text-blue-500') {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            const notificationIcon = document.getElementById('notificationIcon');
            
            notificationText.textContent = text;
            notificationIcon.setAttribute('data-lucide', icon);
            notificationIcon.className = `w-6 h-6 mr-3 ${iconClass}`;
            
            notification.classList.add('show');
            lucide.createIcons();
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.add('hidden');
            });
        }

        function saveData() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('points', JSON.stringify(points));
            localStorage.setItem('messages', JSON.stringify(messages));
            localStorage.setItem('photos', JSON.stringify(photos));
        }

        function formatDate(dateString) {
            if (!dateString) return '未设置';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 任务提醒功能
        setInterval(() => {
            const now = new Date();
            tasks.forEach(task => {
                if (!task.completed && task.deadline) {
                    const deadline = new Date(task.deadline);
                    const timeDiff = deadline - now;
                    
                    // 如果距离截止时间还有1小时，发送提醒
                    if (timeDiff > 0 && timeDiff <= 3600000 && !task.reminded) {
                        showNotification(`⏰ 任务"${task.name}"还有1小时截止！`, 'clock', 'text-orange-500');
                        task.reminded = true;
                        saveData();
                    }
                }
            });
        }, 60000); // 每分钟检查一次

        // 页面可见性变化时的处理
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isMusicPlaying) {
                audio.pause();
            }
        });
    </script>
</body>
</html>
